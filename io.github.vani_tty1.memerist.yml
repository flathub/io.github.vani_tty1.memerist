app-id: io.github.vani_tty1.memerist
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: memerist
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: imagemagick
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-x
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-23.tar.gz
        sha256: f129f7d87fc21da453d032dd291b80ea13faf2497f13ef8279d97759ed7d5c46
        
  - name: memerist
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/vani-tty1/memerist.git
        tag: v0.8.1
        commit: 18ea89f54ce3cbfb34f92596c26fd8ac6441762e
