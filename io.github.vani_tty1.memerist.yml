app-id: io.github.vani_tty1.memerist
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: memerist
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: imagemagick
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-x
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-31.tar.gz
        sha256: 34d9cc3acddc3e3c429d23af60eda5ceaac477a8b296ddb9469f773f44a80a5f
        
  - name: memerist
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/vani-tty1/memerist.git
        tag: v2.2.0
        commit: 7a2864913fd887fb4ab8e6ac99e736c9c7515ed3
